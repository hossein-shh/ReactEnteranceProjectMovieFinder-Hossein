<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMDb - Movie Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo">
        <img src="assets/imdb-logo.png" alt="IMDb" class="logo-img">
      </a>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Search IMDb" autocomplete="off">
        <button class="search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
      <button class="genres-btn">
        Genres
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">Movie Title</h1>
          <div class="hero-tags">
            <span class="tag">Action</span>
            <span class="tag">Adventure</span>
            <span class="tag">Drama</span>
          </div>
          <p class="hero-text">Short description of the movie goes here.</p>
          <p class="hero-status">In theaters</p>
        </div>
      </section>

      <section class="movies-section">
        <div class="movies-grid">
          <article class="movie-card">
            <div class="card-poster"></div>
            <div class="card-body">
              <div class="card-header">
                <h3 class="card-title">Movie Title</h3>
                <p class="card-genres">Genre / Genre</p>
              </div>
              <div class="card-footer">
                <span class="card-rating">★ 8.5</span>
                <button class="card-btn">View Info</button>
              </div>
            </div>
          </article>
          <article class="movie-card">
            <div class="card-poster"></div>
            <div class="card-body">
              <div class="card-header">
                <h3 class="card-title">Movie Title</h3>
                <p class="card-genres">Genre / Genre</p>
              </div>
              <div class="card-footer">
                <span class="card-rating">★ 8.5</span>
                <button class="card-btn">View Info</button>
              </div>
            </div>
          </article>
          <article class="movie-card">
            <div class="card-poster"></div>
            <div class="card-body">
              <div class="card-header">
                <h3 class="card-title">Movie Title</h3>
                <p class="card-genres">Genre / Genre</p>
              </div>
              <div class="card-footer">
                <span class="card-rating">★ 8.5</span>
                <button class="card-btn">View Info</button>
              </div>
            </div>
          </article>
          <article class="movie-card">
            <div class="card-poster"></div>
            <div class="card-body">
              <div class="card-header">
                <h3 class="card-title">Movie Title</h3>
                <p class="card-genres">Genre / Genre</p>
              </div>
              <div class="card-footer">
                <span class="card-rating">★ 8.5</span>
                <button class="card-btn">View Info</button>
              </div>
            </div>
          </article>
          <article class="movie-card">
            <div class="card-poster"></div>
            <div class="card-body">
              <div class="card-header">
                <h3 class="card-title">Movie Title</h3>
                <p class="card-genres">Genre / Genre</p>
              </div>
              <div class="card-footer">
                <span class="card-rating">★ 8.5</span>
                <button class="card-btn">View Info</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 by Karyar Studio</p>
  </footer>
</body>
</html>
